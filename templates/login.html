<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Sign in · ProxDeploy</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e8590c'/%3E%3Ctext x='16' y='22' font-family='-apple-system,sans-serif' font-size='18' font-weight='700' fill='white' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="{{ url_for('static', filename='ui.css') }}">
</head>
<body>
<main class="center">
  <div class="auth">
    <div class="brand-mark" aria-hidden="true">P</div>
    <h1>{% if first_time %}Set a password{% else %}ProxDeploy{% endif %}</h1>
    <p class="sub">
      {% if first_time %}First run — choose the password for this dashboard. It's hashed and stored on the Pi.
      {% else %}Sign in to manage your sites.{% endif %}
    </p>

    <form method="post" action="{{ url_for('login') }}">
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      <label for="password" class="sr-only">Password</label>
      <input class="input" type="password" id="password" name="password" placeholder="Password"
             autocomplete="{% if first_time %}new-password{% else %}current-password{% endif %}"
             {% if first_time %}minlength="12"{% endif %} required autofocus
             {% if error %}aria-invalid="true" aria-describedby="login-error"{% endif %}>
      {% if error %}
      <div class="notice bad" id="login-error" role="alert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2 20h20L12 3Z"/><path d="M12 10v4M12 17h.01"/></svg>
        <span>{{ error }}</span>
      </div>
      {% endif %}
      <button type="submit" class="btn primary lg">{% if first_time %}Set password and continue{% else %}Sign in{% endif %}</button>
    </form>
  </div>
</main>
</body>
</html>
